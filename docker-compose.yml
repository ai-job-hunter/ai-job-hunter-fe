# =============================================================================
# AI Job Hunter - Docker Compose（生产，与 be 仓库同目录部署时二选一 / 保持一致）
# 部署位置：/opt/project/ai-job-hunter/docker-compose.yml
#
# 方案 A：Traefik → ai-job-hunter-fe:80 → Nginx 反代 /api → ai-job-hunter-be:8080
# FE CD 拉起服务名必须是 ai-job-hunter-fe（见 .github/workflows/cd.yml）
# =============================================================================

services:
  ai-job-hunter-fe:
    image: ghcr.io/${IMAGE_NAMESPACE}/ai-job-hunter-fe:${IMAGE_TAG:-latest}
    container_name: ai-job-hunter-fe
    restart: unless-stopped
    mem_limit: ${FE_MEM_LIMIT:-128m}
    mem_reservation: ${FE_MEM_RESERVATION:-32m}
    env_file:
      - .env
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ai-job-hunter-fe.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.ai-job-hunter-fe.entrypoints=websecure"
      - "traefik.http.routers.ai-job-hunter-fe.tls=true"
      - "traefik.http.routers.ai-job-hunter-fe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ai-job-hunter-fe.service=ai-job-hunter-fe"
      - "traefik.http.services.ai-job-hunter-fe.loadbalancer.server.port=80"
      - "traefik.http.routers.ai-job-hunter-fe-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ai-job-hunter-fe-http.entrypoints=web"
      - "traefik.http.routers.ai-job-hunter-fe-http.middlewares=ai-job-hunter-fe-https-redirect"
      - "traefik.http.middlewares.ai-job-hunter-fe-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ai-job-hunter-fe-https-redirect.redirectscheme.permanent=true"

  ai-job-hunter-be:
    image: ghcr.io/${IMAGE_NAMESPACE}/ai-job-hunter-be:${IMAGE_TAG:-latest}
    container_name: ai-job-hunter-be
    restart: unless-stopped
    mem_limit: ${BE_MEM_LIMIT:-768m}
    mem_reservation: ${BE_MEM_RESERVATION:-256m}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # JVM 参数统一在 Dockerfile ENV JAVA_OPTS；这里只限容器内存（mem_limit）
      PGSQL_HOST:     ${PGSQL_HOST}
      PGSQL_PORT:     ${PGSQL_PORT:-5432}
      PGSQL_DB:       ${PGSQL_DB}
      PGSQL_USERNAME: ${PGSQL_USERNAME}
      PGSQL_PASSWORD: ${PGSQL_PASSWORD}
      PGSQL_SSLMODE:  ${PGSQL_SSLMODE:-disable}
      REDIS_HOST:     ${REDIS_HOST}
      REDIS_PORT:     ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - proxy
      - db-net
    labels:
      - "traefik.enable=false"

networks:
  proxy:
    external: true
    name: proxy
  db-net:
    external: true
    name: db-net
