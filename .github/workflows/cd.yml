# =============================================================================
# AI Job Hunter Frontend - CI/CD Workflow
#
# 触发条件：
#   - main 分支 push（自动构建 + 部署）
#   - 手动触发（workflow_dispatch）
#
# 流程：构建 Nuxt SPA → 推送 GHCR 镜像 → SSH 服务器拉镜像重启
#
# 需要的 GitHub Secrets：
#   DEPLOY_HOST          服务器 IP
#   DEPLOY_USER          SSH 用户名
#   DEPLOY_SSH_PORT      SSH 端口（默认 22）
#   DEPLOY_SSH_KEY       SSH 私钥
#
# 需要的 GitHub Variables（可选）：
#   DEPLOY_PRIMARY_BRANCH   主部署分支，默认 main
#   DEPLOY_PATH             服务器部署目录，默认 /opt/project/ai-job-hunter
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PROJECT_NAME: ai-job-hunter-fe
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  DEPLOY_PRIMARY_BRANCH: ${{ vars.DEPLOY_PRIMARY_BRANCH || 'main' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/project/ai-job-hunter' }}

jobs:
  # ─── 分支门控 ────────────────────────────────────────────────────────────
  gate:
    name: Branch Gate
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Check branch
        id: gate
        run: |
          if [ "${{ github.ref_name }}" = "${{ env.DEPLOY_PRIMARY_BRANCH }}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "⏭ Skipping: triggered by ${{ github.ref_name }}, primary is ${{ env.DEPLOY_PRIMARY_BRANCH }}"
          fi

  # ─── 构建 & 推送镜像 ────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.PROJECT_NAME }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.PROJECT_NAME }}:${{ github.run_id }}
            ghcr.io/${{ github.repository_owner }}/${{ env.PROJECT_NAME }}:latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            API_BASE=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract variables
        id: vars
        run: |
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.PROJECT_NAME }}:${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─── 部署到服务器 ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: [gate, build]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate SSH key
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh-keygen -l -f ~/ssh_key
          echo "SSH key validated"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.run_id }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAMESPACE,IMAGE_REGISTRY,DEPLOY_PATH
          script: |
            set -e
            echo "=== Login to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login $IMAGE_REGISTRY -u ${{ github.actor }} --password-stdin

            echo "=== Update docker-tag.env ==="
            {
              echo "IMAGE_TAG=${IMAGE_TAG}"
              echo "IMAGE_NAMESPACE=${IMAGE_NAMESPACE}"
              grep -v '^IMAGE_TAG=\|^IMAGE_NAMESPACE=' $DEPLOY_PATH/docker-tag.env 2>/dev/null || true
            } | tee $DEPLOY_PATH/docker-tag.env > /dev/null

            echo "=== Pull and restart (tag: $IMAGE_TAG) ==="
            docker compose -f $DEPLOY_PATH/docker-compose.yml pull ai-job-hunter-fe
            docker compose -f $DEPLOY_PATH/docker-compose.yml up -d --no-deps ai-job-hunter-fe

            echo "=== Done ==="
            docker compose -f $DEPLOY_PATH/docker-compose.yml ps ai-job-hunter-fe

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: \`${{ secrets.DEPLOY_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.PROJECT_NAME }}:${IMAGE_TAG:-latest}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: rm -f ~/ssh_key
