# =============================================================================
# AI Job Hunter Frontend - CI/CD Workflow
#
# 触发条件：
#   - main 分支 push（自动构建 + 部署）
#   - 手动触发（workflow_dispatch）
#
# 流程：构建 Nuxt SPA → 推送 GHCR 镜像 → SSH 服务器拉镜像重启
#
# 需要的 GitHub Secrets：
#   DEPLOY_HOST          服务器 IP
#   DEPLOY_USER          SSH 用户名
#   DEPLOY_SSH_PORT      SSH 端口（默认 22）
#   DEPLOY_SSH_KEY       SSH 私钥
#   DEPLOY_PATH          服务器部署目录，默认 /opt/project/ai-job-hunter
#
# 需要的 GitHub Variables（可选）：
#   DEPLOY_PRIMARY_BRANCH   主部署分支，默认 main
#
# 变更（2026-11-27）：
#   - Resolve SSH port（空/非法→22）+ timeout 60s
#   - 连上后先 cd DEPLOY_PATH，再写 UPGRADE_LOG / compose（避免 cwd 错位）
#   - handshake EOF 与远程 script 无关，见 be docs/10-DEPLOYMENT.md Q0
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PROJECT_NAME: ai-job-hunter-fe
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  DEPLOY_PRIMARY_BRANCH: ${{ vars.DEPLOY_PRIMARY_BRANCH || 'main' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/project/ai-job-hunter' }}

jobs:
  # ─── 分支门控 ────────────────────────────────────────────────────────────
  gate:
    name: Branch Gate
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Check branch
        id: gate
        run: |
          if [ "${{ github.ref_name }}" = "${{ env.DEPLOY_PRIMARY_BRANCH }}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "⏭ Skipping: triggered by ${{ github.ref_name }}, primary is ${{ env.DEPLOY_PRIMARY_BRANCH }}"
          fi

  # ─── 构建 & 推送镜像 ────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract variables
        id: vars
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          # 镜像 tag 格式：服务名-年月日時分秒（如 ai-job-hunter-fe-20250918103000）
          sanitized=$(echo "$PROJECT_NAME" | sed 's/_/-/g')
          echo "image_tag=${sanitized}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.PROJECT_NAME }}:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.PROJECT_NAME }}:latest
          build-args: |
            API_BASE=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.PROJECT_NAME }}:${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─── 部署到服务器 ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: [gate, build]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate SSH key
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh-keygen -l -f ~/ssh_key
          echo "SSH key validated"

      - name: Resolve SSH port
        id: ssh_port
        env:
          RAW_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          PORT="${RAW_PORT:-22}"
          case "$PORT" in
            ''|*[!0-9]*) PORT=22 ;;
          esac
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "Using SSH port: $PORT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          # 与 job env 默认路径对齐；secret 为空时不要覆盖成空串
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/project/ai-job-hunter' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ steps.ssh_port.outputs.port }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            echo "=== Login to GHCR ==="
            echo "${{ github.token }}" | docker login ${{ env.IMAGE_REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo "=== Update upgrade log (UPGRADE_LOG.md, 仅记录，不注入环境变量) ==="
            TS=$(date -u +'%H:%M')
            TODAY=$(date -u +'%Y-%m-%d')
            TAG=${{ needs.build.outputs.image_tag }}
            if ! grep -qE "^## $TODAY" UPGRADE_LOG.md 2>/dev/null; then
              echo "" >> UPGRADE_LOG.md
              echo "## $TODAY" >> UPGRADE_LOG.md
              echo "" >> UPGRADE_LOG.md
              echo "| 时间 (UTC) | 镜像 tag | 当前 |" >> UPGRADE_LOG.md
              echo "|---|---|---|" >> UPGRADE_LOG.md
            fi
            echo "| $TS | \`$TAG\` | latest |" >> UPGRADE_LOG.md

            echo "=== Pull and restart (tag: latest) ==="
            docker compose -f docker-compose.yml pull ai-job-hunter-fe
            docker compose -f docker-compose.yml up -d --remove-orphans ai-job-hunter-fe

            echo "=== Done ==="
            docker compose -f docker-compose.yml ps ai-job-hunter-fe
      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: \`${{ secrets.DEPLOY_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.PROJECT_NAME }}:${IMAGE_TAG:-latest}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        run: rm -f ~/ssh_key
