server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 方案 A：Traefik 仅转发到本前端；Nginx 再转发 API（与后端同处 proxy 网）。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # 容器健康检查；精确匹配以避免 SPA fallback。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 保留完整 /api 路径，例如 /api/v1/auth/login。
    # 勿在 proxy_pass 末尾加 /，否则会剥掉 /api 前缀导致后端 404。
    # AI / SSE 等长连接：关闭响应缓冲并放宽读取超时。
    location ^~ /api/ {
        proxy_pass http://ai-job-hunter-be:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml;

    # HSTS：浏览器记住只用 HTTPS（避免收藏夹/历史停在 http:// 显示「不安全」）
    # 注意：某 location 若写了 add_header，不会继承这里的头，需在该 location 再写一遍
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SPA：只用 $uri，不要 $uri/（补斜杠 301 在 Traefik 后易写成 http://，Chrome「危险」）
    location / {
        try_files $uri /index.html;
    }
}
